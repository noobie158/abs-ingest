[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abs-ingest"
version = "0.1.0"
description = "Automatic ingest of new audiobooks into an Audiobookshelf library"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "mutagen>=1.47",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
abs-ingest = "abs_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
